<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="Browse houses, apartments, and villas for sale and rent across Nairobi with DreamHomes Real Estate.">
  <title>Properties | DreamHomes Real Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="properties">
  <div id="site-header"></div>
  <main>
    <section class="page-hero page-width">
      <div><p class="eyebrow"><span class="eyebrow-dot"></span> Find your somewhere</p><h1>Places with<br><em>possibility.</em></h1></div>
      <p class="page-hero-copy">Browse homes for sale and rentals across Nairobi County, from single rooms and bedsitters to family homes.</p>
    </section>
    <section class="listing-section page-width">
      <form id="property-filters" class="filter-panel">
        <label><span class="field-label">Looking for</span><select name="listing"><option value="">Rent or buy</option><option value="rent">For rent</option><option value="sale">For sale</option></select></label>
        <label><span class="field-label">Location</span><select name="location" data-location-options><option value="">All Nairobi areas</option></select></label>
        <label><span class="field-label">Property type</span><select name="type"><option value="">All types</option><option>House</option><option>Apartment</option><option>Villa</option><option>Bedsitter</option><option>Single room</option></select></label>
        <label><span class="field-label">Bedrooms</span><select name="bedrooms"><option value="">Any</option><option value="single-room">Single room</option><option value="bedsitter">Bedsitter</option><option value="1">1 bedroom</option><option value="2">2 bedrooms</option><option value="3">3 bedrooms</option><option value="4">4 bedrooms</option><option value="5">5+ bedrooms</option></select></label>
        <label><span class="field-label">Price range</span><select name="price" id="price-filter"><option value="">Any price</option></select></label>
        <label><span class="field-label">Sort by</span><select name="sort"><option value="featured">Featured</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="beds">Bedrooms</option></select></label>
      </form>
      <div class="results-heading"><p id="results-count" aria-live="polite"></p><button class="clear-filters" id="clear-filters" type="button">Clear filters <span aria-hidden="true">↺</span></button></div>
      <div class="property-grid" id="all-properties"></div>
      <div class="empty-state" id="empty-state" hidden><span>⌂</span><h2>No places found just yet.</h2><p>Try adjusting your filters and we’ll find a few more possibilities.</p></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
